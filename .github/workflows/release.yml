# Baut Falcon für Windows und veröffentlicht ein GitHub-Release, sobald ein Versions-Tag
# (z. B. v1.2.0) gepusht wird. Falcon erkennt das neue Release dann als Update.
# Danach werden die macOS- und Linux-Version sowie Falcon Mobile für Android (APK) gebaut und an
# dasselbe Release angehängt.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Version prüfen
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG passt nicht zur Version $PKG in package.json"
            exit 1
          fi

      - run: npm ci

      - name: Bauen und veröffentlichen
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Abschnitt aus der CHANGELOG.md als Release-Text. Ohne ihn zeigt GitHub (und damit das Update-Fenster von
      # Falcon bis 2.5.8) die abgeschnittene Commit-Nachricht. Scheitert das, bleibt der Build trotzdem gültig.
      - name: Release-Text aus der CHANGELOG.md
        continue-on-error: true
        shell: bash
        run: |
          awk -v v="## [${GITHUB_REF_NAME#v}]" '/^## /{f=(index($0,v)==1);next} /^\[[0-9.]+\]:/{f=0} f' CHANGELOG.md > release-notes.md
          grep -q '[^[:space:]]' release-notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mac:
    needs: windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Ohne Apple-Entwicklerzertifikat: nicht signiert/notarisiert (arm64 wird ad hoc signiert).
      # hdiutil (für die .dmg) schlägt auf den macOS-Runnern gelegentlich fehl („Resource busy“) → bis zu 3 Versuche
      - name: Bauen und veröffentlichen
        shell: bash
        run: |
          set -o pipefail
          for i in 1 2 3; do
            if npx electron-builder --mac --publish always 2>&1 | tee build.log; then exit 0; fi
            echo "Versuch $i fehlgeschlagen – hänge alte Laufwerke aus und versuche es erneut"
            for v in /Volumes/Falcon*; do [ -e "$v" ] && hdiutil detach "$v" -force || true; done
            sleep 20
          done
          echo "::error title=Mac-Build fehlgeschlagen::$(grep -iE 'error|⨯|hdiutil' build.log | tail -c 3500 | tr '\n' ' ' | sed 's/%/%25/g')"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

  # .deb (Ubuntu, Debian, Mint …)
  linux-deb:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Bei einem Fehler landet das Ende der Ausgabe als Hinweis in der Übersicht (ohne Anmeldung lesbar)
      - name: Bauen und veröffentlichen
        shell: bash
        run: |
          set -o pipefail
          if ! npx electron-builder --linux deb --publish always 2>&1 | tee build.log; then
            echo "::error title=Linux-Build fehlgeschlagen::$(tail -c 3500 build.log | tr '\n' ' ' | sed 's/%/%25/g')"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # .rpm (Fedora, openSUSE …) – auf Ubuntu 22.04: dessen rpmbuild (4.17) verträgt sich mit dem fpm von
  # electron-builder; mit rpmbuild 4.18+ (Ubuntu 24.04, Fedora 41) scheiterte der Build
  linux-rpm:
    needs: windows
    runs-on: ubuntu-22.04
    steps:
      - name: rpmbuild installieren
        run: sudo apt-get update && sudo apt-get install -y rpm

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Bauen und veröffentlichen
        shell: bash
        run: |
          set -o pipefail
          if ! npx electron-builder --linux rpm --publish always 2>&1 | tee build.log; then
            echo "::error title=Linux-Build fehlgeschlagen::$(tail -c 3500 build.log | tr '\n' ' ' | sed 's/%/%25/g')"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Abhängigkeiten
        working-directory: mobile
        run: npm ci

      # android/ wird aus app.json erzeugt (Continuous Native Generation) und nicht eingecheckt
      - name: Android-Projekt erzeugen
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --clean

      - name: APK bauen
        working-directory: mobile/android
        shell: bash
        # Bei Fehlern einmal wiederholen (Downloads von Gradle/Maven brechen gelegentlich ab) und das Ende der Ausgabe als lesbare Annotation zeigen
        run: |
          set -o pipefail
          for i in 1 2; do
            if ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86,x86_64 2>&1 | tee build.log; then exit 0; fi
            echo "Versuch $i fehlgeschlagen"
          done
          echo "::error title=Android-Build fehlgeschlagen::$(grep -E 'FAILURE|What went wrong|error:|Error:|> ' build.log | tail -c 3500 | tr '\n' ' ' | sed 's/%/%25/g')"
          exit 1

      - name: An das Release anhängen
        shell: bash
        run: |
          VERSION="$(node -p "require('./mobile/app.json').expo.version")"
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "Falcon-Mobile-$VERSION.apk"
          gh release upload "$GITHUB_REF_NAME" "Falcon-Mobile-$VERSION.apk" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # iPhone & iPad (seit 2.5.0): unsignierte .ipa zum Installieren über AltStore / SideStore
  # (die signieren die App beim Installieren mit der Apple-ID des Nutzers). Kein Apple-Developer-Konto nötig.
  ios:
    needs: windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Abhängigkeiten
        working-directory: mobile
        run: npm ci

      # ios/ wird aus app.json erzeugt (Continuous Native Generation) und nicht eingecheckt
      - name: iOS-Projekt erzeugen
        working-directory: mobile
        run: npx expo prebuild --platform ios --no-install --clean

      - name: CocoaPods
        working-directory: mobile/ios
        run: pod install

      # Bei einem Fehler landet das Ende der Ausgabe als Hinweis in der Übersicht (ohne Anmeldung lesbar)
      - name: App bauen (ohne Signatur)
        working-directory: mobile/ios
        shell: bash
        run: |
          set -o pipefail
          WS="$(ls -d *.xcworkspace | head -1)"
          SCHEME="${WS%.xcworkspace}"
          if ! xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
              -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)"; then
            echo "::error title=iOS-Build fehlgeschlagen::$(grep -E 'error:' build.log | tail -c 3000 | tr '\n' ' ' | sed 's/%/%25/g')"
            exit 1
          fi

      - name: .ipa packen und an das Release anhängen
        shell: bash
        run: |
          set -e
          VERSION="$(node -p "require('./mobile/app.json').expo.version")"
          APP="$(ls -d mobile/ios/build/Build/Products/Release-iphoneos/*.app | head -1)"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry "Falcon-Mobile-$VERSION.ipa" Payload
          ls -la "Falcon-Mobile-$VERSION.ipa"
          gh release upload "$GITHUB_REF_NAME" "Falcon-Mobile-$VERSION.ipa" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # latest-linux.yml mit .deb und .rpm – damit aktualisieren sich installierte Linux-Versionen selbst
  # (seit 2.4.0 wie unter Windows; Versionen bis 2.3.9 zeigen damit zumindest den Update-Hinweis).
  # Eigener Job nach beiden Linux-Builds, weil die beiden Jobs die Datei sonst gegenseitig überschreiben.
  linux-update-info:
    needs: [linux-deb, linux-rpm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: latest-linux.yml erzeugen und hochladen
        shell: bash
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dl && cd dl
          gh release download "v${VERSION}" --repo "${{ github.repository }}" -p "Falcon-${VERSION}-linux-amd64.deb" -p "Falcon-${VERSION}-linux-x86_64.rpm"
          entry() { printf '  - url: %s\n    sha512: %s\n    size: %s\n' "$1" "$(openssl dgst -sha512 -binary "$1" | base64 -w0)" "$(stat -c %s "$1")"; }
          DEB="Falcon-${VERSION}-linux-amd64.deb"
          RPM="Falcon-${VERSION}-linux-x86_64.rpm"
          {
            printf 'version: %s\nfiles:\n' "$VERSION"
            entry "$DEB"
            entry "$RPM"
            printf 'path: %s\nsha512: %s\nreleaseDate: '"'"'%s'"'"'\n' "$DEB" "$(openssl dgst -sha512 -binary "$DEB" | base64 -w0)" "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          } > latest-linux.yml
          cat latest-linux.yml
          gh release upload "v${VERSION}" latest-linux.yml --clobber --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
