<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>Neuer Tab</title>
<style>
  :root {
    --accent: #7c6cff;
    --bg: #101113;
    --tile: #1b1c1f;
    --tile-hover: #222327;
    --line: rgb(255 255 255 / .07);
    --line-2: rgb(255 255 255 / .11);
    --text: #ececee;
    --text-2: #a3a3ab;
    --text-3: #6e6e77;
    --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --font-display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 0 24px; background: var(--bg); color: var(--text);
    font: 13px/1.45 var(--font); -webkit-font-smoothing: antialiased;
  }
  body.has-bg { background: #0b0c0e center / cover no-repeat fixed; }
  body.has-bg::before { inset: 0; height: auto; background: linear-gradient(180deg, rgb(0 0 0 / .6), rgb(0 0 0 / .45) 45%, rgb(0 0 0 / .7)); }
  body.has-bg .brand span { text-shadow: 0 2px 14px rgb(0 0 0 / .7); }
  body.has-bg #q { background: rgb(22 23 26 / .78); backdrop-filter: blur(10px); }
  body.has-bg .tile { background: rgb(20 21 24 / .45); backdrop-filter: blur(8px); }
  body.has-bg .tile:hover { background: rgb(30 31 35 / .65); }
  body.has-bg footer { color: rgb(255 255 255 / .7); }
  body.no-shortcuts #grid, body.no-clock footer { display: none; }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: 420px; pointer-events: none;
    background: radial-gradient(60% 100% at 50% 0%, color-mix(in oklab, var(--accent) 9%, transparent), transparent);
  }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: rgb(255 255 255 / .1); border-radius: 10px; border: 3px solid var(--bg); }

  main { position: relative; width: 100%; max-width: 680px; margin-top: max(56px, 20vh); }

  .brand { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 28px; }
  .brand img { width: 40px; height: 40px; border-radius: 10px; }
  .brand span { font: 600 28px/1 var(--font-display); letter-spacing: -.02em; }

  form { position: relative; }
  form svg { position: absolute; left: 18px; top: 50%; width: 18px; height: 18px; margin-top: -9px; fill: none; stroke: var(--text-3); stroke-width: 1.8; stroke-linecap: round; pointer-events: none; }
  #q {
    width: 100%; height: 48px; padding: 0 110px 0 48px; border: 0; border-radius: 24px; outline: 0;
    background: var(--tile); color: var(--text); font: 15px var(--font);
    box-shadow: inset 0 0 0 1px var(--line-2), 0 8px 24px -12px rgb(0 0 0 / .6);
    transition: box-shadow .15s, background-color .15s;
  }
  #q:hover { background: var(--tile-hover); }
  #q:focus { background: var(--tile-hover); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--accent) 60%, transparent), 0 0 0 4px color-mix(in oklab, var(--accent) 14%, transparent); }
  #q::placeholder { color: var(--text-3); }
  .engine { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: var(--text-3); font-size: 12px; pointer-events: none; }

  .shortcuts { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 4px; margin-top: 40px; }
  .tile {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 16px 6px 12px; border-radius: 12px; color: var(--text-2); text-decoration: none; outline: 0;
    transition: background-color .12s;
  }
  .tile:hover, .tile:focus-visible { background: rgb(255 255 255 / .04); color: var(--text); }
  .tile .ic { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--tile); box-shadow: inset 0 0 0 1px var(--line); }
  .tile:hover .ic { background: var(--tile-hover); }
  .tile .ic img { width: 24px; height: 24px; border-radius: 4px; }
  .tile .ic b { font: 600 18px var(--font-display); color: var(--text-2); }
  .tile .label { max-width: 100%; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .more {
    position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border: 0; border-radius: 50%;
    background: transparent; color: var(--text-3); display: grid; place-items: center; opacity: 0; cursor: default;
  }
  .tile:hover .more, .more:focus-visible { opacity: 1; }
  .more:hover { background: rgb(255 255 255 / .08); color: var(--text); }
  .more svg { width: 14px; height: 14px; fill: currentColor; }
  .add .ic { background: transparent; box-shadow: inset 0 0 0 1px var(--line-2); }
  .add .ic svg { width: 20px; height: 20px; stroke: var(--text-2); stroke-width: 1.8; fill: none; stroke-linecap: round; }
  button.tile { border: 0; background: none; font: inherit; cursor: default; }

  .menu {
    position: fixed; z-index: 10; min-width: 160px; padding: 5px; border-radius: 10px; background: #1f2023;
    box-shadow: 0 0 0 1px rgb(255 255 255 / .07), 0 12px 32px -6px rgb(0 0 0 / .6);
  }
  .menu button { width: 100%; height: 30px; padding: 0 10px; border: 0; border-radius: 6px; background: none; color: var(--text); font: inherit; text-align: left; }
  .menu button:hover { background: rgb(255 255 255 / .06); }
  .menu button.danger { color: #f0585b; }

  dialog { width: 380px; padding: 0; border: 0; border-radius: 14px; background: #17181b; color: var(--text); box-shadow: 0 0 0 1px rgb(255 255 255 / .07), 0 24px 60px -10px rgb(0 0 0 / .7); }
  dialog::backdrop { background: rgb(0 0 0 / .55); }
  dialog form { padding: 20px; }
  dialog h3 { margin: 0 0 16px; font: 600 16px var(--font-display); }
  dialog label { display: grid; gap: 6px; margin-bottom: 12px; font-size: 12px; color: var(--text-2); }
  dialog input { height: 34px; padding: 0 11px; border: 0; border-radius: 6px; outline: 0; background: #0e0f11; color: var(--text); font: 13px var(--font); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .11); }
  dialog input:focus { box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 3px color-mix(in oklab, var(--accent) 14%, transparent); }
  .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  .row button { height: 30px; padding: 0 13px; border: 0; border-radius: 6px; font: 500 13px var(--font); background: transparent; color: var(--text-2); }
  .row button:hover { background: rgb(255 255 255 / .06); color: var(--text); }
  .row .primary { background: var(--accent); color: var(--accent-fg, #fff); }
  .row .primary:hover { background: color-mix(in oklab, var(--accent) 86%, white); color: var(--accent-fg, #fff); }

  footer { position: fixed; right: 20px; bottom: 16px; color: var(--text-3); font-size: 12px; font-variant-numeric: tabular-nums; }
  footer b { color: var(--text-2); font-weight: 500; }
</style>
</head>
<body>
  <main>
    <div class="brand"><img src="../../assets/falcon.png" alt="" /><span>Falcon</span></div>

    <form id="search" autocomplete="off">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      <input id="q" spellcheck="false" data-t-placeholder="Im Web suchen oder Adresse eingeben" autofocus />
      <span class="engine" id="engineName"></span>
    </form>

    <nav class="shortcuts" id="grid"></nav>
  </main>

  <footer id="clock"></footer>

  <dialog id="dlg">
    <form method="dialog" id="tileForm">
      <h3 id="dlgTitle"></h3>
      <label><span data-t="Name"></span><input id="tTitle" required /></label>
      <label><span data-t="Adresse"></span><input id="tUrl" required placeholder="https://" /></label>
      <div class="row"><button type="button" id="cancel" data-t="Abbrechen"></button><button class="primary" data-t="Fertig"></button></div>
    </form>
  </dialog>

<script>
'use strict';
const params = new URLSearchParams(location.search);

// ----- Einstellungen aus Falcon -----
const CONFIG = window.falconNewTab || {};
if (CONFIG.image) {
  document.body.classList.add('has-bg');
  document.body.style.backgroundImage = `url("${CONFIG.image.replace(/"/g, '%22')}")`;
}
document.body.classList.toggle('no-shortcuts', CONFIG.showShortcuts === false);
document.body.classList.toggle('no-clock', CONFIG.showClock === false);
const ENGINES = {
  google: ['Google', 'https://www.google.com/search?q='],
  duckduckgo: ['DuckDuckGo', 'https://duckduckgo.com/?q='],
  bing: ['Bing', 'https://www.bing.com/search?q='],
  brave: ['Brave Search', 'https://search.brave.com/search?q='],
  ecosia: ['Ecosia', 'https://www.ecosia.org/search?q=']
};
const [engineName, engineUrl] = ENGINES[params.get('engine')] || ENGINES.google;

// ----- Sprache -----
const LOCALES = { de: 'de-DE', en: 'en-US', fr: 'fr-FR', es: 'es-ES', tr: 'tr-TR' };
const STRINGS = {
  en: { 'Neuer Tab': 'New tab', 'Im Web suchen oder Adresse eingeben': 'Search the web or enter address', 'Verknüpfungen': 'Shortcuts', 'Verknüpfung hinzufügen': 'Add shortcut', 'Verknüpfung bearbeiten': 'Edit shortcut', 'Name': 'Name', 'Adresse': 'URL', 'Abbrechen': 'Cancel', 'Fertig': 'Done', 'Verknüpfung': 'Add shortcut', 'Bearbeiten': 'Edit', 'Entfernen': 'Remove' },
  fr: { 'Neuer Tab': 'Nouvel onglet', 'Im Web suchen oder Adresse eingeben': 'Rechercher sur le Web ou saisir une adresse', 'Verknüpfungen': 'Raccourcis', 'Verknüpfung hinzufügen': 'Ajouter un raccourci', 'Verknüpfung bearbeiten': 'Modifier le raccourci', 'Name': 'Nom', 'Adresse': 'URL', 'Abbrechen': 'Annuler', 'Fertig': 'OK', 'Verknüpfung': 'Raccourci', 'Bearbeiten': 'Modifier', 'Entfernen': 'Retirer' },
  es: { 'Neuer Tab': 'Nueva pestaña', 'Im Web suchen oder Adresse eingeben': 'Busca en la Web o escribe una dirección', 'Verknüpfungen': 'Accesos directos', 'Verknüpfung hinzufügen': 'Añadir acceso directo', 'Verknüpfung bearbeiten': 'Editar acceso directo', 'Name': 'Nombre', 'Adresse': 'URL', 'Abbrechen': 'Cancelar', 'Fertig': 'Listo', 'Verknüpfung': 'Acceso directo', 'Bearbeiten': 'Editar', 'Entfernen': 'Quitar' },
  tr: { 'Neuer Tab': 'Yeni sekme', 'Im Web suchen oder Adresse eingeben': 'Web\'de arayın veya adres girin', 'Verknüpfungen': 'Kısayollar', 'Verknüpfung hinzufügen': 'Kısayol ekle', 'Verknüpfung bearbeiten': 'Kısayolu düzenle', 'Name': 'Ad', 'Adresse': 'URL', 'Abbrechen': 'İptal', 'Fertig': 'Bitti', 'Verknüpfung': 'Kısayol', 'Bearbeiten': 'Düzenle', 'Entfernen': 'Kaldır' }
};
const lang = LOCALES[params.get('lang')] ? params.get('lang') : 'de';
const T = (s) => (STRINGS[lang] && STRINGS[lang][s]) || s;
document.documentElement.lang = lang;
document.title = T('Neuer Tab');
document.querySelectorAll('[data-t]').forEach((n) => { n.textContent = T(n.dataset.t); });
document.querySelectorAll('[data-t-placeholder]').forEach((n) => { n.placeholder = T(n.dataset.tPlaceholder); });
document.getElementById('grid').setAttribute('aria-label', T('Verknüpfungen'));
const accent = params.get('accent');
if (/^#[0-9a-f]{6}$/i.test(accent || '')) {
  document.documentElement.style.setProperty('--accent', accent);
  const [r, g, b] = [1, 3, 5].map((i) => parseInt(accent.slice(i, i + 2), 16) / 255);
  if (0.2126 * r + 0.7152 * g + 0.0722 * b > 0.55) document.documentElement.style.setProperty('--accent-fg', '#0b0b0d');
}
document.getElementById('engineName').textContent = engineName;

// ----- Suche -----
const looksLikeUrl = (s) => !/\s/.test(s) && (/^[a-z][a-z\d+.-]*:\/\//i.test(s) || /^[^\s/?#]+\.[a-z]{2,63}(:\d+)?([/?#].*)?$/i.test(s) || /^localhost(:\d+)?/i.test(s));
document.getElementById('search').addEventListener('submit', (e) => {
  e.preventDefault();
  const s = document.getElementById('q').value.trim();
  if (!s) return;
  if (!looksLikeUrl(s)) location.href = engineUrl + encodeURIComponent(s);
  else location.href = /^[a-z][a-z\d+.-]*:\/\//i.test(s) ? s : (/^localhost/i.test(s) ? 'http://' : 'https://') + s;
});

// ----- Verknüpfungen -----
const KEY = 'falcon.shortcuts';
const DEFAULTS = [
  ['YouTube', 'https://www.youtube.com'], ['Twitch', 'https://www.twitch.tv'], ['Steam', 'https://store.steampowered.com'],
  ['Epic Games', 'https://store.epicgames.com'], ['Discord', 'https://discord.com/app'], ['Reddit', 'https://www.reddit.com'],
  ['GOG', 'https://www.gog.com'], ['Humble Bundle', 'https://www.humblebundle.com']
].map(([title, url]) => ({ title, url }));
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || DEFAULTS; } catch { return DEFAULTS; } };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(tiles)); } catch {} };
let tiles = load();
const MAX_TILES = 12;

const el = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids.filter(Boolean)); return n; };
const host = (u) => { try { return new URL(u).hostname; } catch { return ''; } };

function tileIcon(t) {
  const wrap = el('span', { className: 'ic' });
  const img = el('img', { src: `https://www.google.com/s2/favicons?sz=64&domain=${encodeURIComponent(host(t.url))}`, alt: '' });
  img.onerror = () => img.replaceWith(el('b', {}, (t.title || '?').charAt(0).toUpperCase()));
  wrap.append(img);
  return wrap;
}

function render() {
  const grid = document.getElementById('grid');
  grid.replaceChildren();
  tiles.forEach((t, i) => {
    const more = el('button', { className: 'more', title: T('Verknüpfung bearbeiten'), type: 'button' });
    more.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="18.5" r="1.6"/></svg>';
    more.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); openMenu(i, more); });
    grid.append(el('a', { className: 'tile', href: t.url, title: t.title }, tileIcon(t), el('span', { className: 'label' }, t.title), more));
  });
  if (tiles.length < MAX_TILES) {
    const add = el('button', { className: 'tile add', type: 'button' });
    add.innerHTML = '<span class="ic"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span><span class="label"></span>';
    add.querySelector('.label').textContent = T('Verknüpfung');
    add.addEventListener('click', () => openDialog(-1));
    grid.append(add);
  }
}

let menu = null;
function closeMenu() { menu?.remove(); menu = null; }
function openMenu(i, anchor) {
  closeMenu();
  const edit = el('button', { type: 'button' }, T('Bearbeiten'));
  const del = el('button', { type: 'button', className: 'danger' }, T('Entfernen'));
  edit.onclick = () => { closeMenu(); openDialog(i); };
  del.onclick = () => { closeMenu(); tiles.splice(i, 1); save(); render(); };
  menu = el('div', { className: 'menu' }, edit, del);
  document.body.append(menu);
  const r = anchor.getBoundingClientRect();
  menu.style.left = `${Math.min(r.left, innerWidth - menu.offsetWidth - 8)}px`;
  menu.style.top = `${r.bottom + 4}px`;
}
document.addEventListener('mousedown', (e) => { if (menu && !menu.contains(e.target)) closeMenu(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });

const dlg = document.getElementById('dlg');
let editing = -1;
function openDialog(i) {
  editing = i;
  document.getElementById('dlgTitle').textContent = T(i < 0 ? 'Verknüpfung hinzufügen' : 'Verknüpfung bearbeiten');
  document.getElementById('tTitle').value = i < 0 ? '' : tiles[i].title;
  document.getElementById('tUrl').value = i < 0 ? '' : tiles[i].url;
  dlg.showModal();
}
document.getElementById('cancel').onclick = () => dlg.close();
document.getElementById('tileForm').addEventListener('submit', () => {
  let url = document.getElementById('tUrl').value.trim();
  if (!/^[a-z][a-z\d+.-]*:\/\//i.test(url)) url = 'https://' + url;
  const entry = { title: document.getElementById('tTitle').value.trim() || host(url), url };
  if (editing < 0) tiles.push(entry); else tiles[editing] = entry;
  save();
  render();
});

render();

// ----- Uhr -----
function tick() {
  const d = new Date();
  const clock = document.getElementById('clock');
  clock.replaceChildren(
    el('b', {}, d.toLocaleTimeString(LOCALES[lang], { hour: '2-digit', minute: '2-digit' })),
    ` · ${d.toLocaleDateString(LOCALES[lang], { weekday: 'long', day: 'numeric', month: 'long' })}`);
}
tick();
setInterval(tick, 15000);
</script>
</body>
</html>
