<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101113" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com; img-src 'self' https://www.google.com https://*.gstatic.com data:; style-src 'self' 'unsafe-inline'" />
  <title>Falcon</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="../logo.png" />
  <link rel="apple-touch-icon" href="../logo.png" />
  <style>
    :root {
      --accent: #7c6cff; --bg: #101113; --surface: #17181b; --raised: #1f2023; --line: rgb(255 255 255 / .08);
      --text: #ececee; --text-2: #a3a3ab; --text-3: #6e6e77; --danger: #f0585b;
      --font: -apple-system, "Segoe UI", system-ui, Roboto, sans-serif;
      color-scheme: dark;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); }
    body { min-height: 100dvh; padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px); }
    .hidden { display: none !important; }
    svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    header { display: flex; align-items: center; gap: 10px; padding: 18px 0 14px; }
    header img { width: 30px; height: 30px; }
    header h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -.01em; flex: 1; }
    .ghost { border: 0; background: none; color: var(--text-2); font: inherit; font-size: 14px; padding: 8px; }
    /* Anmeldung */
    .login { max-width: 420px; margin: 8vh auto 0; display: grid; gap: 14px; }
    .login p { margin: 0 0 6px; color: var(--text-2); font-size: 14px; }
    label { display: grid; gap: 6px; font-size: 13px; color: var(--text-2); }
    input { height: 46px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--raised); color: var(--text); font: 16px var(--font); outline: 0; }
    input:focus { border-color: color-mix(in oklab, var(--accent) 70%, transparent); }
    .primary { height: 48px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: 600 15px var(--font); }
    .primary:disabled { opacity: .6; }
    .error { min-height: 20px; margin: 0; color: var(--danger); font-size: 13.5px; }
    .note { color: var(--text-3); font-size: 12.5px; line-height: 1.5; }
    /* Inhalt */
    .tabs { display: flex; gap: 6px; padding: 4px; margin-bottom: 12px; border-radius: 12px; background: var(--raised); }
    .tabs button { flex: 1; height: 36px; border: 0; border-radius: 9px; background: none; color: var(--text-2); font: 500 14px var(--font); }
    .tabs button.sel { background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
    .search { position: relative; margin-bottom: 12px; }
    .search input { width: 100%; padding-left: 40px; }
    .search svg { position: absolute; left: 13px; top: 14px; color: var(--text-3); }
    .card { border-radius: 14px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
    .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; color: var(--text); text-decoration: none; min-height: 54px; }
    .row + .row, .folder + .row, .row + .folder, .folder + .folder { border-top: 1px solid var(--line); }
    .row img { width: 20px; height: 20px; border-radius: 4px; flex: none; }
    .row .t { flex: 1; min-width: 0; display: grid; }
    .row b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row small { color: var(--text-3); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .folder > summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 52px; font-weight: 600; cursor: pointer; }
    .folder > summary::-webkit-details-marker { display: none; }
    .folder > summary .chev { margin-left: auto; color: var(--text-3); transition: transform .15s; }
    .folder[open] > summary .chev { transform: rotate(90deg); }
    .folder > .kids { border-top: 1px solid var(--line); padding-left: 14px; background: rgb(255 255 255 / .015); }
    .folder svg.fi { color: var(--accent); }
    .device h2 { display: flex; align-items: center; gap: 8px; margin: 18px 4px 8px; font-size: 13px; font-weight: 600; color: var(--text-2); }
    .device h2 span { margin-left: auto; font-weight: 400; color: var(--text-3); }
    .empty { padding: 40px 10px; text-align: center; color: var(--text-3); }
    .spinner { width: 22px; height: 22px; margin: 40px auto; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <img src="../logo.png" alt="" />
    <h1>Falcon</h1>
    <button id="logout" class="ghost hidden" type="button">Abmelden</button>
  </header>

  <form id="login" class="login" autocomplete="on">
    <p>Melde dich mit deinem Falcon-Konto an, um deine Lesezeichen und die offenen Tabs deiner PCs zu sehen.</p>
    <label>E-Mail-Adresse <input id="email" type="email" autocomplete="username" required /></label>
    <label>Passwort <input id="password" type="password" autocomplete="current-password" required /></label>
    <p id="error" class="error"></p>
    <button id="submit" class="primary" type="submit">Anmelden</button>
    <p class="note">Deine Daten werden erst hier auf dem Handy mit deinem Passwort entschlüsselt. Das Passwort wird nicht gespeichert.</p>
  </form>

  <main id="app" class="hidden">
    <div class="tabs">
      <button data-view="bookmarks" class="sel">Lesezeichen</button>
      <button data-view="devices">Tabs von PCs</button>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      <input id="q" type="search" placeholder="Suchen" autocomplete="off" />
    </div>
    <div id="content"><div class="spinner"></div></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
